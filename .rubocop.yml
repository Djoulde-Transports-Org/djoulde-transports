# Omakase Ruby styling for Rails (bundles rubocop + rubocop-rails + rubocop-performance)
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# Layer rubocop-rspec on top
plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - "frontend/**/*"
    - "spec/frontend/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
    - "db/migrate/*"
    - "bin/*"
    - "tmp/**/*"
    - "log/**/*"
    - "storage/**/*"
