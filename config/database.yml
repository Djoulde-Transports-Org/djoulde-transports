# MySQL configuration is driven entirely by ENV (Figaro lands in ticket 03).
# Do NOT store secrets here and do NOT read from Rails.application.secrets.
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  host:     <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port:     <%= ENV.fetch("DATABASE_PORT", 3306).to_i %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "djoulde_transports_development") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME_CACHE", "djoulde_transports_development_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME_QUEUE", "djoulde_transports_development_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME_CABLE", "djoulde_transports_development_cable") %>
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME_TEST", "djoulde_transports_test") %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "djoulde_transports_production") %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME_CACHE", "djoulde_transports_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME_QUEUE", "djoulde_transports_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DATABASE_NAME_CABLE", "djoulde_transports_production_cable") %>
    migrations_paths: db/cable_migrate
