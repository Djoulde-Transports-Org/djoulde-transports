user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
  access_log  /var/log/nginx/access.log  main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;
  client_max_body_size  25m;

  upstream rails { server rails:3000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header   Host              $host;
  proxy_set_header   X-Real-IP         $remote_addr;
  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   X-Forwarded-Host  $host;
  proxy_set_header   Upgrade           $http_upgrade;
  proxy_set_header   Connection        $connection_upgrade;
  proxy_read_timeout 60s;

  # Docker's embedded DNS server lets us resolve service names at request
  # time. Using a variable for proxy_pass defers resolution from boot to
  # request, so nginx starts even if a downstream service (e.g. frontend)
  # isn't running yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen  80;
    server_name  _;

    # Health route (Rails::HealthController) stays on Rails.
    location = /up { proxy_pass http://rails; }

    # Rails-owned path prefixes per ticket 05 path table.
    location /api/                  { proxy_pass http://rails; }
    location /oauth/                { proxy_pass http://rails; }
    location /oauth                 { proxy_pass http://rails; }
    location /admin/                { proxy_pass http://rails; }
    location /admin                 { proxy_pass http://rails; }
    location /rails/active_storage/ { proxy_pass http://rails; }

    # Default: everything else goes to the SvelteKit frontend.
    # Returns 502 until ticket 13 implements the frontend service.
    location / {
      set $frontend_upstream "http://frontend:5173";
      proxy_pass $frontend_upstream;
    }
  }
}
