# Full dev stack for djoulde-transports.
# Ticket 02: mysql, redis, rails. Ticket 05: nginx proxy. Ticket 13: SvelteKit frontend.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-djoulde_transports_development}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      # Use the build stage for local dev: it carries the C toolchain
      # (build-essential, *-dev headers) needed to compile native gem
      # extensions like json when `bundle install` runs in the container.
      # The lean `runtime` target lacks these and is for production images.
      target: build
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-djoulde_transports_development}
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: "5"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    expose:
      - "5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - dev

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dev
      - frontend

volumes:
  mysql_data:
  redis_data:
  bundle_cache:
  frontend_node_modules:
