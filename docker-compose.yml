# Full dev stack for djoulde-transports.
# Ticket 02 wires mysql, redis, and rails. Ticket 05 promotes proxy to the
# single public entry point. frontend remains a skeleton placeholder until
# ticket 13 (SvelteKit).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-djoulde_transports_development}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rails:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DATABASE_NAME: ${DATABASE_NAME:-djoulde_transports_development}
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: "5"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle

  frontend:
    image: alpine:3.20
    command: ["sh", "-c", "echo 'frontend service placeholder — SvelteKit in ./frontend (ticket 13)'"]
    profiles: ["skeleton"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rails
    # NOTE: frontend is omitted from depends_on while it's a skeleton-profile
    # placeholder; compose v2 rejects depends_on across profiles. Ticket 13
    # promotes frontend to a full service and should restore the dependency.

volumes:
  mysql_data:
  redis_data:
  bundle_cache:
